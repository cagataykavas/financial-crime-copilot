name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      FC_DATABASE_PATH: /tmp/financial_crime_ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and dev dependencies
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q
      - name: Domain demo smoke test
        run: python copilot.py
      - name: Packaged API and governance import smoke test
        run: python -c "from service.api import app; from governance import PolicyGate; assert app.version == '0.3.0'; assert PolicyGate"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t financial-crime-copilot:ci .
